[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ana"
version = "0.1.0"
description = "Does a doubly-stochastic per-role operator recover what QKV sharing costs?"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "sentencepiece>=0.2",
    "sacrebleu>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ana = "ana.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
